name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  # ── Qualidade: TypeScript ────────────────────────────────────────────────────
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend

  # ── Qualidade: ESLint ────────────────────────────────────────────────────────
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meu-app/package-lock.json
      - run: npm ci
        working-directory: meu-app
      - run: npm run lint
        working-directory: meu-app

  # ── 20 Testes automatizados com estatísticas de cobertura ───────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:coverage
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

  # ── Versionamento + Build + Push das imagens ─────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nomes das imagens em lowercase
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/entrega-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/entrega-frontend" >> $GITHUB_ENV

      - name: Calcular versão
        id: version
        run: |
          PKG=$(node -p "require('./backend/package.json').version")
          SHA=${GITHUB_SHA::8}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=v${PKG}" >> $GITHUB_OUTPUT
          else
            echo "value=v${PKG}-dev.${SHA}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push — Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./meu-app
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Criar tag Git (somente main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.value }} || true
          git push origin ${{ steps.version.outputs.value }} || true

  # ── Homologação (develop e main) ─────────────────────────────────────────────
  deploy-homolog:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    environment: homologacao
    steps:
      - name: Deploy Homologação
        run: |
          echo "Versão ${{ needs.build-and-push.outputs.version }} publicada em homologação"
          # Quando tiver servidor, substituir pelo bloco abaixo:
          # ssh ${{ secrets.HOMOLOG_USER }}@${{ secrets.HOMOLOG_HOST }} "\
          #   docker pull ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.version }} && \
          #   docker pull ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.version }} && \
          #   cd /app && docker compose up -d"

  # ── Produção (somente main — aguarda aprovação manual no GitHub) ─────────────
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-homolog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: producao
    steps:
      - name: Deploy Produção
        run: |
          echo "Versão ${{ needs.build-and-push.outputs.version }} publicada em produção"
          # Quando tiver servidor, substituir pelo bloco abaixo:
          # ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "\
          #   docker pull ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.version }} && \
          #   docker pull ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.version }} && \
          #   cd /app && docker compose up -d"
